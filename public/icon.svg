    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".18" stop-color="#e6ddff" stop-opacity=".7"/><stop offset=".5" stop-color="#b9a6ff" stop-opacity=".25"/><stop offset="1" stop-color="#b9a6ff" stop-opacity="0"/></radialGradient>
