<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2b2266"/>
      <stop offset=".55" stop-color="#141031"/>
      <stop offset="1" stop-color="#07060f"/>
    </radialGradient>
    <radialGradient id="auraV" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8f7bff" stop-opacity=".55"/><stop offset="1" stop-color="#8f7bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="auraT" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7fe0d6" stop-opacity=".35"/><stop offset="1" stop-color="#7fe0d6" stop-opacity="0"/></radialGradient>
    <radialGradient id="auraG" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f3d98b" stop-opacity=".3"/><stop offset="1" stop-color="#f3d98b" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset=".45" stop-color="#c9b8ff" stop-opacity=".55"/><stop offset="1" stop-color="#c9b8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".18" stop-color="#eee8ff"/>
      <stop offset=".45" stop-color="#b9a6ff"/>
      <stop offset=".72" stop-color="#6d5bd6"/>
      <stop offset="1" stop-color="#241c5a"/>
    </radialGradient>
    <radialGradient id="teal" cx="60%" cy="80%" r="45%"><stop offset="0" stop-color="#8fe3c8" stop-opacity=".55"/><stop offset="1" stop-color="#8fe3c8" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3d98b" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#fff4d1" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f3d98b" stop-opacity=".2"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="back"><rect x="0" y="0" width="1024" height="512"/></clipPath>
    <clipPath id="front"><rect x="0" y="512" width="1024" height="512"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="300" cy="260" r="330" fill="url(#auraV)" filter="url(#blur)"/>
  <circle cx="800" cy="780" r="300" fill="url(#auraT)" filter="url(#blur)"/>
  <circle cx="240" cy="820" r="260" fill="url(#auraG)" filter="url(#blur)"/>
  <g fill="#fff">
    <circle cx="180" cy="190" r="4" opacity=".8"/><circle cx="820" cy="210" r="5" opacity=".9"/><circle cx="880" cy="420" r="3" opacity=".6"/>
    <circle cx="150" cy="560" r="3" opacity=".6"/><circle cx="760" cy="880" r="4" opacity=".7"/><circle cx="330" cy="880" r="3" opacity=".5"/>
    <circle cx="640" cy="130" r="3" opacity=".6"/><circle cx="110" cy="380" r="2.5" opacity=".5"/>
  </g>
  <!-- órbita atrás -->
  <g clip-path="url(#back)" transform="rotate(-16 512 512)">
    <ellipse cx="512" cy="512" rx="330" ry="92" fill="none" stroke="url(#ring)" stroke-width="7" opacity=".45"/>
  </g>
  <circle cx="512" cy="512" r="320" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="232" fill="url(#orb)"/>
  <circle cx="512" cy="512" r="232" fill="url(#teal)"/>
  <ellipse cx="440" cy="420" rx="92" ry="58" fill="#fff" opacity=".55" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="231" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
  <!-- órbita na frente -->
  <g clip-path="url(#front)" transform="rotate(-16 512 512)">
    <ellipse cx="512" cy="512" rx="330" ry="92" fill="none" stroke="url(#ring)" stroke-width="8"/>
  </g>
  <g transform="rotate(-16 512 512)">
    <circle cx="742" cy="578" r="34" fill="#fff4d1" opacity=".35" filter="url(#soft)"/>
    <circle cx="742" cy="578" r="15" fill="#fff8e6"/>
  </g>
</svg>
